<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: PJS; src: url("fonts/PlusJakartaSans-500.ttf") format("truetype"); font-weight: 500; }
  @font-face { font-family: PJS; src: url("fonts/PlusJakartaSans-600.ttf") format("truetype"); font-weight: 600; }
  @font-face { font-family: PJS; src: url("fonts/PlusJakartaSans-700.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: PJS; src: url("fonts/PlusJakartaSans-800.ttf") format("truetype"); font-weight: 800; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  .card {
    width: 1200px;
    height: 630px;
    position: relative;
    background:
      radial-gradient(ellipse 560px 420px at 92% 8%, rgba(20,196,184,0.18), transparent 68%),
      radial-gradient(ellipse 480px 380px at 8% 108%, rgba(21,101,192,0.12), transparent 70%),
      #ffffff;
    display: flex;
    align-items: center;
    padding: 0 72px 0 84px;
    gap: 48px;
    font-family: PJS, "Liberation Sans", sans-serif;
  }
  .spine {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 8px;
    background: linear-gradient(180deg, #1565C0 0%, #14C4B8 100%);
  }
  .copy { flex: 1; min-width: 0; position: relative; z-index: 1; }
  h1 {
    font-weight: 800;
    font-size: 88px;
    line-height: 0.95;
    letter-spacing: -0.045em;
  }
  h1 .omni { color: #0B1C30; }
  h1 .graph { color: #14C4B8; }
  .rule {
    width: 84px;
    height: 5px;
    border-radius: 99px;
    margin-top: 22px;
    background: linear-gradient(90deg, #1565C0, #14C4B8);
  }
  .tagline {
    margin-top: 22px;
    max-width: 560px;
    font-size: 23px;
    font-weight: 500;
    line-height: 1.38;
    letter-spacing: -0.015em;
    color: #24364A;
  }
  .pillars {
    margin-top: 36px;
    display: flex;
    gap: 22px;
    align-items: center;
  }
  .pillars li {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: #0B1C30;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 99px;
    flex: none;
  }
  .dot.c { background: #1565C0; }
  .dot.t { background: #14C4B8; }
  .mark {
    flex: none;
    width: 292px;
    height: 292px;
    position: relative;
    z-index: 1;
  }
  .halo {
    position: absolute;
    inset: -28px;
    border-radius: 80px;
    background: radial-gradient(circle, rgba(20,196,184,0.28), rgba(21,101,192,0.08) 52%, transparent 70%);
  }
  .tile {
    position: absolute;
    inset: 0;
    border-radius: 64px;
    background: #0B1C30;
    box-shadow:
      0 30px 60px rgba(11,28,48,0.18),
      0 1px 0 rgba(255,255,255,0.06) inset;
    display: grid;
    place-items: center;
  }
  .tile svg { width: 210px; height: 210px; display: block; }
</style>
</head>
<body>
  <div class="card">
    <div class="spine"></div>
    <div class="copy">
      <h1><span class="omni">Omni</span><span class="graph">Graph</span></h1>
      <div class="rule"></div>
      <p class="tagline">Omni-channel marketing performance and analysis for aligned teams and faster DTC delivery.</p>
      <ul class="pillars">
        <li><span class="dot c"></span>UNIFY</li>
        <li><span class="dot t"></span>ANALYZE</li>
        <li><span class="dot c"></span>ALIGN</li>
        <li><span class="dot t"></span>ACCELERATE</li>
      </ul>
    </div>
    <div class="mark">
      <div class="halo"></div>
      <div class="tile">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="9.2" fill="none" stroke="#1565C0" stroke-width="2.9" stroke-linecap="round" stroke-dasharray="31 27.7" stroke-dashoffset="46"/>
          <circle cx="16" cy="16" r="9.2" fill="none" stroke="#14C4B8" stroke-width="2.9" stroke-linecap="round" stroke-dasharray="31 27.7" stroke-dashoffset="16.8"/>
          <rect x="11.15" y="16.7" width="2.45" height="4.9" rx="0.6" fill="#F4FBFA"/>
          <rect x="14.78" y="14.1" width="2.45" height="7.5" rx="0.6" fill="#F4FBFA"/>
          <rect x="18.4" y="11.5" width="2.45" height="10.1" rx="0.6" fill="#14C4B8"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
