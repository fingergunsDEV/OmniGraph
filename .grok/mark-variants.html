<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  body { margin:0; background:#e8eef3; display:flex; gap:28px; padding:28px; align-items:flex-start; }
  .tile { width:220px; height:220px; background:#0B1C30; border-radius:48px; display:grid; place-items:center; }
  svg { width:160px; height:160px; }
  figcaption { font: 14px sans-serif; color:#0B1C30; margin-top:8px; text-align:center; }
</style>
</head>
<body>
  <figure>
    <div class="tile">
      <svg viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="9.2" fill="none" stroke="#1565C0" stroke-width="2.9" stroke-linecap="round" stroke-dasharray="31 27.7" stroke-dashoffset="46"/>
        <circle cx="16" cy="16" r="9.2" fill="none" stroke="#14C4B8" stroke-width="2.9" stroke-linecap="round" stroke-dasharray="31 27.7" stroke-dashoffset="16.8"/>
        <rect x="11.15" y="16.7" width="2.45" height="4.9" rx="0.6" fill="#F4FBFA"/>
        <rect x="14.78" y="14.1" width="2.45" height="7.5" rx="0.6" fill="#F4FBFA"/>
        <rect x="18.4" y="11.5" width="2.45" height="10.1" rx="0.6" fill="#14C4B8"/>
      </svg>
    </div>
    <figcaption>A same-center dash</figcaption>
  </figure>
  <figure>
    <div class="tile">
      <svg viewBox="0 0 32 32">
        <circle cx="16.45" cy="15.65" r="9.15" fill="none" stroke="#1565C0" stroke-width="2.85" stroke-linecap="round" stroke-dasharray="33 24.5" stroke-dashoffset="44"/>
        <circle cx="15.55" cy="16.35" r="9.15" fill="none" stroke="#14C4B8" stroke-width="2.85" stroke-linecap="round" stroke-dasharray="33 24.5" stroke-dashoffset="14.5"/>
        <rect x="11.15" y="16.7" width="2.45" height="4.9" rx="0.6" fill="#F4FBFA"/>
        <rect x="14.78" y="14.1" width="2.45" height="7.5" rx="0.6" fill="#F4FBFA"/>
        <rect x="18.4" y="11.5" width="2.45" height="10.1" rx="0.6" fill="#14C4B8"/>
      </svg>
    </div>
    <figcaption>B offset interlock</figcaption>
  </figure>
  <figure>
    <div class="tile">
      <svg viewBox="0 0 32 32">
        <defs>
          <linearGradient id="ring" x1="4" y1="6" x2="28" y2="26" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#1565C0"/>
            <stop offset="1" stop-color="#14C4B8"/>
          </linearGradient>
        </defs>
        <circle cx="16" cy="16" r="9.2" fill="none" stroke="url(#ring)" stroke-width="2.9"/>
        <path d="M22.6 8.4 A 7.2 7.2 0 0 1 26.8 16.2" fill="none" stroke="#14C4B8" stroke-width="2.9" stroke-linecap="round"/>
        <rect x="11.15" y="16.7" width="2.45" height="4.9" rx="0.6" fill="#F4FBFA"/>
        <rect x="14.78" y="14.1" width="2.45" height="7.5" rx="0.6" fill="#F4FBFA"/>
        <rect x="18.4" y="11.5" width="2.45" height="10.1" rx="0.6" fill="#14C4B8"/>
      </svg>
    </div>
    <figcaption>C gradient ring</figcaption>
  </figure>
</body>
</html>
